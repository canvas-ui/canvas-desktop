name: release

# Create or resume a draft at its original commit; publish only after all
# platform builds and installer validation succeed. Complete releases are skipped.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      ref: ${{ steps.v.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/verify-desktop-version.mjs
          node scripts/desktop-release.mjs prepare

  build:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      release-tag: ${{ needs.prepare.outputs.tag }}
      build-ref: ${{ needs.prepare.outputs.ref }}

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify installers and publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: node scripts/desktop-release.mjs finalize
